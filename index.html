.side>*{position:relative}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.55);display:block}
.side h1{font-size:18px;font-weight:800;margin:14px 0 8px;letter-spacing:-.3px}
.side p{margin:0;font-size:15px;line-height:1.45;max-width:300px}
.side hr{width:8px;border:0;border-top:2px solid #ddd;margin:22px 0}
.nav{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:auto auto;grid-template-rows:repeat(3,auto);grid-auto-flow:column;gap:14px 34px;text-align:left}
.nav a{color:#fff;display:flex;align-items:center;gap:12px;font-size:15px}
.nav svg{width:20px;height:20px;fill:#fff;flex:none}
.nav a:hover{text-decoration:none;opacity:.75}
.lang{margin-top:26px;display:inline-flex;border:1px solid rgba(255,255,255,.5);border-radius:3px;overflow:hidden}.lang button{background:none;border:0;color:#fff;font:600 12px 'Open Sans';padding:4px 12px;cursor:pointer}.lang button.on{background:#fff;color:#0d3b30}

/* Feed */
main{margin-left:max(300px,min(26%,494px))}
.col{max-width:750px;margin:0 auto;padding:30px 40px 0}
.post{display:flex;gap:20px;padding:0 0 22px;margin-bottom:22px;border-bottom:1px solid #eee}
.thumb{flex:none;width:140px;height:140px;display:block}
.body{flex:1;min-width:0}
.body h2{margin:-6px 0 0;font:800 29px/1.4 'Open Sans';color:#444;letter-spacing:-1.2px}
.date{font-size:13px;color:#888;margin:4px 0 14px}
.sum{font:300 16px/1.9 'Merriweather',Georgia,serif;color:#666;margin:0}
.rd{display:inline-block;margin-top:22px;font-size:13px;background:none;border:0;padding:0;color:#1e88e5;cursor:pointer;font-family:inherit}
.rd:hover{text-decoration:underline}
.more{display:none;margin-top:14px;font:300 15px/1.8 'Merriweather',Georgia,serif;color:#666}
.more.open{display:block}
.more ul{padding-left:20px;margin:8px 0}
.more .stack{font:13px 'Open Sans';color:#888;margin-top:10px}
.more .stack b{color:#555}
.empty{font:300 16px/1.9 Merriweather,Georgia,serif;color:#888;padding:40px 0;border-bottom:1px solid #eee;margin:0 0 22px}
.pager{text-align:right;color:#999;font-size:13px;padding:0 10px 0 0;margin:-6px 0 0}
h3.sec{font:800 24px 'Open Sans';letter-spacing:-.8px;margin:60px 0 18px;color:#444}
.list{list-style:none;padding:0;margin:0}
.list li{padding:12px 0;border-bottom:1px solid #eee;display:flex;gap:20px}
.list .d{flex:none;width:140px;font-size:13px;color:#888;padding-top:3px}
.list b{color:#444}
.list span{display:block;font:300 15px/1.7 'Merriweather',Georgia,serif;color:#666}
.sk{font:300 15px/1.9 'Merriweather',Georgia,serif;color:#666}
.sk b{font:600 14px 'Open Sans';color:#444;display:block;margin-top:12px}
footer{text-align:center;color:#999;font-size:14px;padding:80px 0 60px}

@media(max-width:820px){
 .side{position:relative;inset:auto;width:100%;max-width:none;min-height:0;padding:40px 20px}
 main{margin-left:0}
 .col{padding:24px 18px 0}
 .post{flex-direction:column}
 .body h2{margin-top:0;font-size:24px}
 .list li{flex-direction:column;gap:0}
}
</style>

     en:{t:"Title",s:"Short summary.",body:"<p>Full text in HTML (optional).</p>"}
   }
*/
const POSTS=[
];

let L='es';try{const s=localStorage.getItem('lang');if(s)L=s}catch(e){}
const open=new Set(),$=s=>document.querySelector(s);

function thumb(p){
 if(p.img)return `<img class="thumb" src="${p.img}" alt="">`;
 const [a,b]=p.color||["#334155","#64748b"],m=p.mark||"";
 return `<svg class="thumb" viewBox="0 0 140 140" aria-hidden="true"><defs><linearGradient id="g${p.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="140" height="140" fill="url(#g${p.id})"/><text x="70" y="84" text-anchor="middle" font-family="Open Sans,sans-serif" font-weight="800" font-size="44" fill="#fff">${m}</text></svg>`}

function render(){
 const t=T[L];document.documentElement.lang=L;
 $('#tag').textContent=t.tag;$('#n1').textContent=t.n1;document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 $('#pager').textContent=t.page;
 $('#feed').innerHTML=POSTS.length?POSTS.map(p=>{const c=p[L]||p.es,o=open.has(p.id);
  return `<article class="post">${thumb(p)}<div class="body">
   <h2>${c.t}</h2><div class="date">${p.date}</div>
   <p class="sum">${c.s}</p>
   ${c.body?`<div class="more ${o?'open':''}">${c.body}</div><button class="rd" data-r="${p.id}">${o?t.less:t.read}</button>`:''}
   ${p.link?`<a class="rd" href="${p.link}" target="_blank" rel="noopener">${t.read}</a>`:''}
  </div></article>`}).join(''):`<p class="empty">${t.empty}</p>`;
 try{localStorage.setItem('lang',L)}catch(e){}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;const id=b.dataset.r;open.has(id)?open.delete(id):open.add(id);render()});
$('#lang').onclick=e=>{const b=e.target.closest('[data-l]');if(b){L=b.dataset.l;render()}};
render();
</script>
</body>
</html>
